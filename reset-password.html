<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="icon" href="foto/title-logo.png" type="image/icon">
  <title>Reset Password - Mototrade</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .reset-container {
      max-width: 450px;
      margin: 150px auto 50px;
      padding: 40px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    .reset-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .reset-header h2 {
      color: #328bce;
      font-weight: 700;
    }
    .reset-header p {
      color: #8d8d8d;
      font-size: 14px;
    }
    .form-control {
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ebebeb;
      border-radius: 5px;
    }
    .form-control:focus {
      border-color: #328bce;
      box-shadow: 0 0 0 0.2rem rgba(50,139,206,0.25);
    }
    .btn-reset {
      width: 100%;
      padding: 12px;
      background-color: #328bce;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-reset:hover {
      background-color: #2574b0;
    }
    .alert {
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 5px;
      display: none;
    }
    .alert-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .alert-danger {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .back-link {
      text-align: center;
      margin-top: 20px;
    }
    .back-link a {
      color: #328bce;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary" id="navbar">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html"><img src="foto/logo.gif" alt="Logo" style="width: 150px; height: 50px;"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
      aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="index.html">Home</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="listing.html" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Listing
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="new-cars.html">New Cars</a></li>
            <li><a class="dropdown-item" href="used-cars.html">Used Cars</a></li>
            <li><a class="dropdown-item" href="electric-cars.html">Electric Cars</a></li>
          </ul>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="about.html">About</a>

        <li class="nav-item">

        <!-- Dynamic Login/User Section -->

          <a class="nav-link" href="login.html" style="color: #328bce; font-weight: 700;">

          </a>
        </li>

    </div>
  </div>
</nav>

  <!-- RESET PASSWORD FORM -->
  <div class="container">
    <div class="reset-container">
      <div class="reset-header">
        <h2><i class="fas fa-lock-open"></i> Reset Password</h2>
        <p>Enter your new password below</p>
      </div>

      <div id="alertBox" class="alert"></div>
      <div id="invalidToken" style="display:none; text-align:center; padding: 20px;">
        <i class="fas fa-exclamation-triangle" style="font-size: 50px; color: #dc3545;"></i>
        <h4 style="color: #dc3545; margin-top: 15px;">Invalid or Expired Link</h4>
        <p style="color: #8d8d8d;">This reset link has expired or already been used.</p>
        <a href="forgot-password.html" class="btn" style="display: inline-block; margin-top: 10px;">Request New Link</a>
      </div>

      <form id="resetForm">
        <input type="password" class="form-control" id="newPassword" placeholder="New Password *" required>
        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm New Password *" required>
        <button type="submit" class="btn-reset" id="resetBtn">
          <i class="fas fa-save"></i> Save New Password
        </button>
      </form>

      <div class="back-link">
        <p><a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Get token and email from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const email = urlParams.get('email');

    // If no token or email, show invalid message
    if (!token || !email) {
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('invalidToken').style.display = 'block';
    }

    document.getElementById('resetForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('resetBtn');

      // Validate passwords
      if (newPassword !== confirmPassword) {
        showAlert('Passwords do not match!', 'danger');
        return;
      }

      if (newPassword.length < 6) {
        showAlert('Password must be at least 6 characters!', 'danger');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

      const formData = new FormData();
      formData.append('token', token);
      formData.append('email', email);
      formData.append('new_password', newPassword);
      formData.append('confirm_password', confirmPassword);

      fetch('backend/reset_password.php', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          showAlert('Password reset successfully! Redirecting to login...', 'success');
          document.getElementById('resetForm').style.display = 'none';
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          showAlert(data.message, 'danger');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-save"></i> Save New Password';
        }
      })
      .catch(error => {
        showAlert('An error occurred. Please try again.', 'danger');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> Save New Password';
      });
    });

    function showAlert(message, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.className = `alert alert-${type}`;
      alertBox.textContent = message;
      alertBox.style.display = 'block';
    }
  </script>
<script>
fetch('backend/check_session.php')
  .then(response => response.json())
  .then(data => {
    const navAuthSection = document.getElementById('navAuthSection');
    if (navAuthSection && data.logged_in) {
      const firstName = data.user.name.split(' ')[0];
      navAuthSection.innerHTML = `
        <div class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" style="color: #328bce; font-weight: 700;">
            <i class="fas fa-user-circle"></i> Hi, ${firstName}
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> My Dashboard</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="backend/logout.php"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
          </ul>
        </div>
      `;
    }
  })
  .catch(error => console.log('Not logged in'));
</script>
