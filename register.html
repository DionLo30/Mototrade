<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900&display=swap" rel="stylesheet">
  <link rel="icon" href="foto/title-logo.png" type="image/icon">
  <title>Register - Mototrade</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .register-container {
      max-width: 500px;
      margin: 150px auto 50px;
      padding: 40px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    .register-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .register-header h2 {
      color: #328bce;
      font-weight: 700;
    }
    .form-control {
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ebebeb;
      border-radius: 5px;
    }
    .form-control:focus {
      border-color: #328bce;
      box-shadow: 0 0 0 0.2rem rgba(50, 139, 206, 0.25);
    }
    .btn-register {
      width: 100%;
      padding: 12px;
      background-color: #328bce;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-register:hover {
      background-color: #2574b0;
    }
    .login-link {
      text-align: center;
      margin-top: 20px;
    }
    .login-link a {
      color: #328bce;
      text-decoration: none;
      font-weight: 600;
    }
    .alert {
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 5px;
      display: none;
    }
    .alert-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .alert-danger {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary" id="navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html"><img src="foto/logo.gif" alt="Logo" style="width: 150px; height: 50px;"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="listing.html" role="button" data-bs-toggle="dropdown">
              Listing
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="new-cars.html">New Cars</a></li>
              <li><a class="dropdown-item" href="used-cars.html">Used Cars</a></li>
              <li><a class="dropdown-item" href="electric-cars.html">Electric Cars</a></li>
            </ul>
          </li>
          <li class="nav-item">

</li>
<li class="nav-item">
  <a style="color: #328bce;" class="nav-link active" href="login.html">Login</a>
</li>
          <li class="nav-item">
            <a style="color: #328bce;" class="nav-link active" href="login.html">Login</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- REGISTER FORM -->
  <div class="container">
    <div class="register-container">
      <div class="register-header">
        <h2><i class="fas fa-user-plus"></i> Create Account</h2>
        <p style="color: #8d8d8d;">Register to book your dream car</p>
      </div>

      <div id="alertBox" class="alert"></div>

      <form id="registerForm">
        <input type="text" class="form-control" id="firstName" placeholder="First Name *" required>
        <input type="text" class="form-control" id="lastName" placeholder="Last Name *" required>
        <input type="email" class="form-control" id="email" placeholder="Email Address *" required>
        <input type="tel" class="form-control" id="phone" placeholder="Phone Number *" required>
        <input type="password" class="form-control" id="password" placeholder="Password *" required>
        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password *" required>
        
        <button type="submit" class="btn-register" id="registerBtn">
          <i class="fas fa-user-check"></i> Register
        </button>
      </form>

      <div class="login-link">
        <p>Already have an account? <a href="login.html">Login here</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      // Validate passwords match
      if (password !== confirmPassword) {
        showAlert('Passwords do not match!', 'danger');
        return;
      }
      
      // Validate password length
      if (password.length < 6) {
        showAlert('Password must be at least 6 characters long!', 'danger');
        return;
      }
      
      // Disable button
      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registering...';
      
      // Submit to backend
      const formData = new FormData();
      formData.append('first_name', firstName);
      formData.append('last_name', lastName);
      formData.append('email', email);
      formData.append('phone', phone);
      formData.append('password', password);
      
      fetch('backend/register.php', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          showAlert('Registration successful! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          showAlert(data.message, 'danger');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-user-check"></i> Register';
        }
      })
      .catch(error => {
        showAlert('An error occurred. Please try again.', 'danger');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-user-check"></i> Register';
      });
    });
    
    function showAlert(message, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.className = `alert alert-${type}`;
      alertBox.textContent = message;
      alertBox.style.display = 'block';
      
      setTimeout(() => {
        alertBox.style.display = 'none';
      }, 5000);
    }
  </script>
</body>
