<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="icon" href="foto/title-logo.png" type="image/icon">
  <title>My Dashboard - Mototrade</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    body { font-family: Roboto, sans-serif; }

    .dashboard-container {
      max-width: 1200px;
      margin: 120px auto 50px;
      padding: 30px;
    }
    .dashboard-header {
      background: linear-gradient(135deg, #328bce 0%, #2574b0 100%);
      color: white;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 22px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.12);
    }
    .dashboard-header h2 { margin: 0; font-weight: 800; }
    .dashboard-header p { margin: 10px 0 0; opacity: 0.95; }

    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 18px 18px;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      height: 100%;
    }
    .stat-card .icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(50,139,206,0.12);
      color: #328bce;
      margin-right: 10px;
      flex: 0 0 auto;
    }
    .stat-card .label { color: #666; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .stat-card .value { font-size: 24px; font-weight: 900; color: #111; }

    .controls-wrap {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      margin: 18px 0 18px;
    }

    .booking-card {
      background: #fff;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 16px;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .booking-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.10);
    }
    .booking-card h4 {
      color: #328bce;
      margin-bottom: 12px;
      font-weight: 900;
      font-size: 18px;
    }
    .booking-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .info-item {
      display: flex;
      align-items: start;
      gap: 10px;
      font-size: 14px;
      color: #333;
    }
    .info-item i { color: #328bce; margin-top: 2px; width: 18px; }
    .info-item strong { margin-right: 6px; }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border: 1px solid rgba(0,0,0,0.06);
    }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-confirmed { background: #d4edda; color: #155724; }
    .status-cancelled { background: #f8d7da; color: #721c24; }

    .total-cost {
      font-size: 18px;
      color: #111;
      font-weight: 900;
    }
    .muted-small { font-size: 12px; color: #8d8d8d; }

    .no-bookings {
      text-align: center;
      padding: 60px 20px;
      background: #f8f9fa;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.06);
    }
    .no-bookings i { font-size: 60px; color: #8d8d8d; margin-bottom: 18px; }

    .btn-logout {
      background-color: #dc3545;
      color: #fff;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .btn-logout:hover { background-color: #c82333; }

    .btn-soft {
      border-radius: 10px;
      font-weight: 800;
      padding: 8px 12px;
    }

    /* make dropdown list-group (if you later add) be above */
    .z-top { z-index: 9999; }
  </style>
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary" id="navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <img src="foto/logo.gif" alt="Logo" style="width: 150px; height: 50px;">
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="listing.html" role="button" data-bs-toggle="dropdown">Listing</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="new-cars.html">New Cars</a></li>
              <li><a class="dropdown-item" href="used-cars.html">Used Cars</a></li>
              <li><a class="dropdown-item" href="electric-cars.html">Electric Cars</a></li>
            </ul>
          </li>

          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>

          <li class="nav-item">
            <a style="color:#328bce;" class="nav-link active" href="dashboard.html">Dashboard</a>
          </li>

          <li class="nav-item ms-lg-2">
            <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- DASHBOARD -->
  <div class="container">
    <div class="dashboard-container">

      <div class="dashboard-header">
        <h2><i class="fas fa-user-circle"></i> My Dashboard</h2>
        <p id="welcomeMessage">Welcome back!</p>
      </div>

      <!-- STATS -->
      <div class="row g-3" id="statsRow">
        <div class="col-md-3">
          <div class="stat-card d-flex align-items-center">
            <div class="icon"><i class="fa-solid fa-receipt"></i></div>
            <div>
              <div class="label">Total bookings</div>
              <div class="value" id="statTotal">—</div>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="stat-card d-flex align-items-center">
            <div class="icon"><i class="fa-solid fa-hourglass-half"></i></div>
            <div>
              <div class="label">Pending</div>
              <div class="value" id="statPending">—</div>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="stat-card d-flex align-items-center">
            <div class="icon"><i class="fa-solid fa-circle-check"></i></div>
            <div>
              <div class="label">Confirmed</div>
              <div class="value" id="statConfirmed">—</div>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="stat-card d-flex align-items-center">
            <div class="icon"><i class="fa-solid fa-circle-xmark"></i></div>
            <div>
              <div class="label">Cancelled</div>
              <div class="value" id="statCancelled">—</div>
            </div>
          </div>
        </div>

        <div class="col-12">
          <div class="stat-card d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div class="d-flex align-items-center">
              <div class="icon"><i class="fa-solid fa-euro-sign"></i></div>
              <div>
                <div class="label">Total spent</div>
                <div class="value" id="statSpent">—</div>
              </div>
            </div>
            <div class="muted-small">Calculated from your booking totals</div>
          </div>
        </div>
      </div>

      <!-- CONTROLS -->
      <div class="controls-wrap">
        <div class="row g-2 align-items-center">
          <div class="col-md-6">
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
              <input id="bookingSearch" type="text" class="form-control" placeholder="Search bookings (car name, location, date...)">
            </div>
          </div>
          <div class="col-md-3">
            <select id="statusFilter" class="form-select">
              <option value="all">All statuses</option>
              <option value="pending">Pending</option>
              <option value="confirmed">Confirmed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="col-md-3 d-flex gap-2 justify-content-md-end">
            <button class="btn btn-outline-secondary btn-soft w-100" id="refreshBtn">
              <i class="fa-solid fa-rotate"></i> Refresh
            </button>
          </div>
        </div>
      </div>

      <h3 style="margin: 6px 0 14px;">My Bookings</h3>

      <div id="bookingsContainer">
        <div class="text-center" style="padding: 40px;">
          <i class="fas fa-spinner fa-spin" style="font-size: 40px; color: #328bce;"></i>
          <p style="margin-top: 16px; color: #8d8d8d;">Loading your bookings...</p>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let ALL_BOOKINGS = [];
    let CAR_URL_MAP = new Map(); // name -> url (from data/cars.json)

    function titleCaseStatus(s) {
      if (!s) return '';
      return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
    }

    function safeNum(n) {
      const x = parseFloat(n);
      return isNaN(x) ? 0 : x;
    }

    function fmtDate(d) {
      try {
        return new Date(d).toLocaleDateString('en-GB', { year:'numeric', month:'short', day:'2-digit' });
      } catch { return d; }
    }

    async function loadCarsJson() {
      // Optional: only needed to enable "View Car" links.
      try {
        const res = await fetch('data/cars.json');
        const cars = await res.json();
        CAR_URL_MAP = new Map(cars.map(c => [String(c.name).trim(), c.url]));
      } catch (e) {
        CAR_URL_MAP = new Map();
      }
    }

    // Session check
    fetch('backend/check_session.php')
      .then(r => r.json())
      .then(async data => {
        if (!data.logged_in) {
          window.location.href = 'login.html';
          return;
        }

        document.getElementById('welcomeMessage').textContent = 'Welcome back, ' + data.user.name + '!';
        await loadCarsJson();
        loadBookings();
      })
      .catch(() => window.location.href = 'login.html');

    document.getElementById('refreshBtn')?.addEventListener('click', loadBookings);
    document.getElementById('bookingSearch')?.addEventListener('input', renderFiltered);
    document.getElementById('statusFilter')?.addEventListener('change', renderFiltered);

    function loadBookings() {
      const container = document.getElementById('bookingsContainer');
      container.innerHTML = `
        <div class="text-center" style="padding: 40px;">
          <i class="fas fa-spinner fa-spin" style="font-size: 40px; color: #328bce;"></i>
          <p style="margin-top: 16px; color: #8d8d8d;">Loading your bookings...</p>
        </div>
      `;

      fetch('backend/get_user_bookings.php')
        .then(r => r.json())
        .then(data => {
          if (data.success && Array.isArray(data.bookings)) {
            ALL_BOOKINGS = data.bookings;
            updateStats(ALL_BOOKINGS);
            renderFiltered();
          } else {
            ALL_BOOKINGS = [];
            updateStats([]);
            renderNoBookings();
          }
        })
        .catch(() => {
          container.innerHTML = `<div class="alert alert-danger">Error loading bookings. Please refresh the page.</div>`;
        });
    }

    function updateStats(bookings) {
      const total = bookings.length;
      const pending = bookings.filter(b => b.status === 'pending').length;
      const confirmed = bookings.filter(b => b.status === 'confirmed').length;
      const cancelled = bookings.filter(b => b.status === 'cancelled').length;

      const spent = bookings.reduce((sum, b) => sum + safeNum(b.total_cost), 0);

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statConfirmed').textContent = confirmed;
      document.getElementById('statCancelled').textContent = cancelled;
      document.getElementById('statSpent').textContent = '€' + spent.toLocaleString(undefined, { maximumFractionDigits: 0 });
    }

    function renderNoBookings() {
      document.getElementById('bookingsContainer').innerHTML = `
        <div class="no-bookings">
          <i class="fas fa-car"></i>
          <h4>No bookings yet</h4>
          <p style="color: #8d8d8d;">Start exploring our cars and make your first booking!</p>
          <a href="new-cars.html" class="btn btn-primary btn-soft" style="background:#328bce;border:none;margin-top:14px;">
            Browse Cars
          </a>
        </div>
      `;
    }

    function matchesSearch(booking, q) {
      if (!q) return true;
      const hay = [
        booking.car_name,
        booking.pickup_location,
        booking.pickup_date,
        booking.return_date,
        booking.status,
        booking.special_requests
      ].join(' ').toLowerCase();
      return hay.includes(q.toLowerCase());
    }

    function renderFiltered() {
      if (!ALL_BOOKINGS || ALL_BOOKINGS.length === 0) return renderNoBookings();

      const q = document.getElementById('bookingSearch').value.trim();
      const status = document.getElementById('statusFilter').value;

      let filtered = ALL_BOOKINGS.filter(b => matchesSearch(b, q));
      if (status !== 'all') filtered = filtered.filter(b => b.status === status);

      const container = document.getElementById('bookingsContainer');
      if (filtered.length === 0) {
        container.innerHTML = `<div class="alert alert-warning">No bookings match your filters.</div>`;
        return;
      }

      container.innerHTML = filtered.map(b => createBookingCard(b)).join('');

      // attach cancel handlers
      container.querySelectorAll('[data-cancel-id]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-cancel-id');
          if (!id) return;

          if (!confirm('Cancel this booking?')) return;

          btn.disabled = true;
          btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Cancelling...';

          try {
            const fd = new FormData();
            fd.append('booking_id', id);
            fd.append('status', 'cancelled');

            const res = await fetch('backend/update_booking_status.php', {
              method: 'POST',
              body: fd
            });

            const data = await res.json();
            if (data.success) {
              // refresh list
              loadBookings();
            } else {
              alert(data.message || 'Failed to cancel booking');
              btn.disabled = false;
              btn.innerHTML = '<i class="fa-solid fa-ban"></i> Cancel';
            }
          } catch (e) {
            alert('Network error. Try again.');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-ban"></i> Cancel';
          }
        });
      });
    }

    function createBookingCard(booking) {
      const statusClass = `status-${booking.status}`;
      const pickupDate = fmtDate(booking.pickup_date);
      const returnDate = fmtDate(booking.return_date);

      const carName = booking.car_name || 'Car';
      const carUrl = CAR_URL_MAP.get(String(carName).trim()) || null;

      const daily = safeNum(booking.car_price);
      const total = safeNum(booking.total_cost);

      const canCancel = booking.status === 'pending';

      return `
        <div class="booking-card">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
            <div>
              <h4 class="mb-1"><i class="fas fa-car"></i> ${escapeHtml(carName)}</h4>
              <div class="muted-small">
                <i class="fas fa-clock"></i> Booked on ${fmtDate(booking.created_at)}
              </div>
            </div>
            <span class="status-badge ${statusClass}">${escapeHtml(titleCaseStatus(booking.status))}</span>
          </div>

          <div class="booking-info mt-3">
            <div class="info-item">
              <i class="fas fa-calendar-alt"></i>
              <div><strong>Pick-up:</strong> ${escapeHtml(pickupDate)}</div>
            </div>
            <div class="info-item">
              <i class="fas fa-calendar-check"></i>
              <div><strong>Return:</strong> ${escapeHtml(returnDate)}</div>
            </div>
            <div class="info-item">
              <i class="fas fa-map-marker-alt"></i>
              <div><strong>Location:</strong> ${escapeHtml(booking.pickup_location || '-')}</div>
            </div>
            <div class="info-item">
              <i class="fas fa-euro-sign"></i>
              <div><strong>Daily Rate:</strong> €${daily.toLocaleString(undefined, { maximumFractionDigits: 0 })}</div>
            </div>
          </div>

          ${booking.special_requests ? `
            <div class="mt-2" style="background:#f8f9fa; padding: 10px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.06);">
              <strong><i class="fas fa-comment"></i> Special Requests:</strong>
              <div style="margin-top:6px; color:#666;">${escapeHtml(booking.special_requests)}</div>
            </div>
          ` : ''}

          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3">
            <div class="total-cost">Total: €${total.toLocaleString(undefined, { maximumFractionDigits: 0 })}</div>

            <div class="d-flex gap-2">
              ${carUrl ? `
                <a class="btn btn-outline-primary btn-soft" href="${carUrl}">
                  <i class="fa-solid fa-eye"></i> View car
                </a>
              ` : `
                <button class="btn btn-outline-secondary btn-soft" disabled title="Car page not found in cars.json">
                  <i class="fa-solid fa-eye"></i> View car
                </button>
              `}

              ${canCancel ? `
                <button class="btn btn-danger btn-soft" data-cancel-id="${booking.id}">
                  <i class="fa-solid fa-ban"></i> Cancel
                </button>
              ` : ``}
            </div>
          </div>
        </div>
      `;
    }

    // simple HTML escape for safety
    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function logout() {
      if (confirm('Are you sure you want to logout?')) {
        window.location.href = 'backend/logout.php';
      }
    }
  </script>
</body>
</html>
